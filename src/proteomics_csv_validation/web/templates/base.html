<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <title>
    {% block title %}Proteomics CSV Validation{% endblock %}
  </title>
  <link
    rel="stylesheet"
    href="/static/app.css"
  >
</head>
<body>
  <a
    class="skip-link"
    href="#main-content"
  >Skip to main content</a>

  <header class="app-header">
    <div class="app-shell">
      <div class="brand-lockup">
        <span class="app-name">
          Proteomics CSV Validation
        </span>
        <span class="app-context">
          Local structural review
        </span>
      </div>

      <nav
        class="app-nav"
        aria-label="Primary"
      >
        <a href="/review">Review</a>
        <a href="/history">History</a>
        <a href="/compare">Compare</a>
      </nav>
    </div>
  </header>

  <main
    id="main-content"
    class="app-main"
  >
    {% block content %}{% endblock %}
  </main>
</body>
</html>
