[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proteomics-csv-validation"
version = "0.4.0"
description = "Local rule-based validation of proteomics processed-sample CSV records."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [
  { name = "Joanne Y. Chan" }
]
maintainers = [
  { name = "Joanne Y. Chan" }
]
keywords = [
  "proteomics",
  "csv",
  "data quality",
  "validation",
  "reproducibility"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9"
]
web = [
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "Jinja2==3.1.6",
  "python-multipart==0.0.32"
]

[project.scripts]
proteomics-csv-validate = "proteomics_csv_validation.cli:main"
proteomics-csv-app = "proteomics_csv_validation.web.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["proteomics_csv_validation*"]
namespaces = false

[tool.setuptools.package-data]
"proteomics_csv_validation.infrastructure.sqlite" = ["migrations/*.sql"]
"proteomics_csv_validation.profiles" = ["data/*.json"]

"proteomics_csv_validation.web" = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
