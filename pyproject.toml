[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proteomics-csv-validation"
version = "0.1.0"
description = "Local rule-based validation of synthetic proteomics processed-sample CSV records."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [
  { name = "Joanne Yu Yan Chan" }
]
maintainers = [
  { name = "Joanne Yu Yan Chan" }
]
keywords = [
  "proteomics",
  "csv",
  "data quality",
  "validation",
  "reproducibility"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9"
]

[project.scripts]
proteomics-csv-validate = "proteomics_csv_validation.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["proteomics_csv_validation*"]
namespaces = false

[tool.setuptools.package-data]
"proteomics_csv_validation.profiles" = ["data/*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
