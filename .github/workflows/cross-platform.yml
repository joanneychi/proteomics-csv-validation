name: Cross-platform verification

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.11"
          - os: ubuntu-24.04
            python: "3.12"
          - os: ubuntu-24.04
            python: "3.13"
          - os: ubuntu-24.04
            python: "3.14"
          - os: windows-2025
            python: "3.14"
          - os: macos-15
            python: "3.14"

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev,web]"

      - name: Check installed requirements
        run: python -m pip check

      - name: Record environment identity
        run: python -c "import importlib.metadata as m, platform, sys; print('platform=' + platform.platform()); print('machine=' + platform.machine()); print('python=' + sys.version.replace(chr(10), ' ')); print('package=' + m.version('proteomics-csv-validation'))"

      - name: Run test suite
        run: python -m pytest -q

      - name: Check command version
        run: proteomics-csv-validate --version

  build:
    name: Build release artifacts
    needs: test
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install build frontend
        run: python -m pip install build

      - name: Build source distribution and wheel
        run: python -m build

      - name: Record artifact hashes
        run: python -c "from pathlib import Path; import hashlib; [print(hashlib.sha256(p.read_bytes()).hexdigest(), p.name) for p in sorted(Path('dist').iterdir()) if p.is_file()]"

      - name: Upload release-candidate artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proteomics-csv-validation-dist
          path: dist/*
          if-no-files-found: error
